name: Indexar Publicações Automático

on:
  push:
    paths:
      - 'gestao-e-futuro/publicacoes/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Executar script de indexação
        run: python gerar_posts.py

      - name: Commit e Push do posts.json atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gestao-e-futuro/posts.json
          git status
          git commit -m "auto: atualiza posts.json automaticamente" || exit 0
          git push
